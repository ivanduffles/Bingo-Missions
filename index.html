<!doctype html>
<html lang="pt-BR">
<head>
<!-- PROTOTYPE - NOT FOR PRODUCTION -->
<!-- Question: Does the Bingo event core loop (Sortear -> stamps -> line close) feel right on mobile? -->
<!-- Date: 2026-04-24 -->
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Bingo da Rainha — Prototype</title>
<link rel="stylesheet" href="styles.css" />
</head>
<body>
<div class="event-screen">

  <header class="event-header">
    <button class="back-button" aria-label="Voltar">‹</button>
    <h1 class="event-name">Bingo da Rainha</h1>
  </header>

  <div class="countdown-subtitle" id="countdown-subtitle">
    Evento termina em 7 dias
  </div>

  <section class="tombola-zone">
    <div class="tombola-top">
      <div class="drum" aria-hidden="true">
        <div class="drum-body" id="drum-body"></div>
        <div class="drum-spout"></div>
      </div>
      <div class="ball-ledger" id="ball-ledger" aria-hidden="true"></div>
    </div>

    <button class="sortear" id="sortear-btn">Sortear</button>

    <div class="dev-actions">
      <button class="dev-btn" id="dev-day-btn" title="Dev: avança 1 dia">+1 Dia (dev)</button>
      <button class="dev-btn" id="dev-win-btn" title="Dev: simula vitória (+1 bola, máx 3/dia)">+1 Vitória (dev)</button>
      <button class="dev-btn" id="dev-reset-ftue-btn" title="Dev: reseta FTUE — recarregue para ver de novo">Resetar FTUE (dev)</button>
    </div>

    <div class="tombola-meta">
      <div class="ball-counter" id="ball-counter">🎱 10 bolas</div>
    </div>
  </section>

  <div class="cartela-wrapper">
    <section class="cartela" id="cartela">
      <!-- Tiles rendered by app.js -->
    </section>
  </div>

</div>

<!-- Ball travel stage: fixed overlay for balls, sweeps, currency floats -->
<div class="ball-stage" id="ball-stage" aria-hidden="true"></div>

<!-- First-line-in-event banner -->
<div class="first-line-banner" id="first-line-banner" aria-hidden="true">
  <span class="banner-text"></span>
</div>

<!-- Mission tap popup -->
<div class="mission-popup-backdrop" id="mission-popup-backdrop" aria-hidden="true">
  <div class="mission-popup-card" role="dialog" aria-modal="true">
    <button class="mission-popup-close" id="mission-popup-close" aria-label="Fechar">×</button>
    <h2 class="mission-popup-title" id="mission-popup-title"></h2>
    <p class="mission-popup-progress" id="mission-popup-progress"></p>
    <p class="mission-popup-disambig" id="mission-popup-disambig"></p>
    <p class="mission-popup-reward" id="mission-popup-reward"></p>
  </div>
</div>

<!-- FTUE Beat A: three labeled callouts pointing at cartela / tombola / countdown -->
<div class="ftue-overlay" id="ftue-beat-a" aria-hidden="true">
  <div class="ftue-backdrop" id="ftue-beat-a-backdrop"></div>
  <div class="ftue-callout ftue-callout--countdown" id="ftue-callout-countdown">
    <span class="ftue-arrow ftue-arrow--up"></span>
    <span class="ftue-caption-text">O evento termina em alguns dias.</span>
  </div>
  <div class="ftue-callout ftue-callout--tombola" id="ftue-callout-tombola">
    <span class="ftue-arrow ftue-arrow--up"></span>
    <span class="ftue-caption-text">Sorteie bolas para marcar os números.</span>
  </div>
  <div class="ftue-callout ftue-callout--cartela" id="ftue-callout-cartela">
    <span class="ftue-caption-text">Complete linhas e ganhe prêmios.</span>
    <span class="ftue-arrow ftue-arrow--down"></span>
  </div>
  <button class="ftue-entendi" id="ftue-beat-a-entendi">Entendi</button>
</div>

<!-- FTUE Beat B: animated pointer finger over a target mission tile with soft-block -->
<div class="ftue-overlay" id="ftue-beat-b" aria-hidden="true">
  <div class="ftue-backdrop ftue-backdrop--soft" id="ftue-beat-b-backdrop"></div>
  <div class="ftue-pointer" id="ftue-pointer">👆</div>
  <div class="ftue-caption-b" id="ftue-caption-b">Toque para ver detalhes da missão.</div>
  <button class="ftue-pular" id="ftue-pular">Pular</button>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
